# CI on every PR and push; deploy Worker to Cloudflare on push to main only.
# Required repo secrets (deploy job): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Optional Sentry source maps (deploy): SENTRY_AUTH_TOKEN secret; SENTRY_ORG + SENTRY_PROJECT repo variables
# See docs/DEPLOY.md — deploy job applies D1 remote migrations before Worker deploy.
#
# Action versions (2026-09): checkout/setup-node v7; wrangler-action v4 (Wrangler from package-lock after npm ci).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-flight main deploy mid migrate/deploy (schema/code skew risk).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint, format, test, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Oxlint
        run: npm run lint

      - name: Oxfmt (check)
        run: npm run format:check

      - name: D1 migrations (local apply + drift gate)
        run: npm run db:migrate:check

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Validate Workers bundle (dry-run)
        run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy to Cloudflare Workers
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        env:
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npm run build

      - name: Apply D1 migrations (remote)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply photography --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # SENTRY_RELEASE → sentryOptionsFromEnv; dist-worker → npm run sentry:sourcemaps (not Astro dist/)
          command: deploy --var SENTRY_RELEASE:${{ github.sha }} --outdir dist-worker --upload-source-maps

      - name: Upload Worker source maps to Sentry
        env:
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npm run sentry:sourcemaps
